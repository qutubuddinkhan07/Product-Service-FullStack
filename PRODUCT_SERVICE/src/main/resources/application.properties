spring.application.name=PRODUCT_SERVICE

# Server configuration
server.port=8080

## Profile Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load .env config for local development
spring.config.import=optional:file:.env[.properties]

# === Database Configuration ======
# Docker based configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/productservice
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# After this use terminal with MySQL Client
# mysql --user avnadmin --password --host mysql-product-inventory-qutubuddinkhan8261-da43.b.aivencloud.com --port 26661 defaultdb
# Here password should be given after it promts to enter it


# Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.signature=${JWT_SIG}